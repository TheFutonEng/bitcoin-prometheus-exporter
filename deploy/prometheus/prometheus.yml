global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bitcoin
    static_configs:
      - targets: ["exporter:9332"]
        labels:
          node: bitcoind

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

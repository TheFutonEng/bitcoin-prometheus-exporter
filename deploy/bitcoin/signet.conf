# Node configuration for running the stack against signet.
#
# Signet has real peers and a real chain, so peer-detail and fee-estimate
# metrics carry realistic values — useful for looking at the dashboard with
# something other than regtest's empty state. It needs outbound network access
# and a few minutes to sync.
#
# Select it with BITCOIN_CONF and BITCOIN_COOKIE in .env; see that file.

signet=1
server=1

[signet]
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcport=8332

# Signet fee estimation has little history early on; this keeps the wallet
# usable before estimates are available.
fallbackfee=0.0002

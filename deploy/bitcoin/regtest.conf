# Node configuration for the regtest development stack.
#
# The image's entrypoint sets -datadir=/data, so bitcoind reads this file at
# /data/bitcoin.conf. The stack passes no command-line flags to the node, which
# makes this file the single source of truth — point BITCOIN_CONF in .env at
# your own file to replace it wholesale.
#
# The network is selected here rather than with -chain on purpose: bitcoind
# refuses to start when a command-line -chain and a conf-file network setting
# are both present ("Invalid combination of -regtest, -signet, -testnet,
# -testnet4 and -chain").

regtest=1
server=1

[regtest]
# The exporter reaches the node over the compose network, so RPC has to listen
# on more than loopback. Nothing is published off the host except through
# docker-compose.yml, which binds 127.0.0.1.
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcport=8332

# Lets the regtest wallet build transactions before fee estimation has any
# history to work from.
fallbackfee=0.0002

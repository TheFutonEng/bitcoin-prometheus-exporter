name: ci

# Every job behind the `changes` gate is skipped on a documentation-only change.
# The workflow itself always runs: the main ruleset requires a check named
# `integration`, and a workflow filtered out by paths-ignore never reports it,
# which would block a docs-only PR forever.
#
# The required check is the `integration-result` job, named `integration`. It
# always runs and passes only if change detection succeeded and, for a code
# change, every leg of the integration matrix passed. The matrix legs report as
# `integration (<image>)`, so they never satisfy the required name themselves.
#
# Documentation-only means every changed file is `*.md` or `LICENSE`, and
# nothing else: a file type nobody thought about runs the suite rather than
# silently skipping it. Deliberately NOT treated as documentation, because they
# look inert but are exactly what a job validates:
#   deploy/grafana/dashboards/*.json  the stack job checks every query as PromQL
#   deploy/prometheus/alerts.yml      the stack job checks each rule evaluates
#   deploy/bitcoin/*.conf             the stack job boots the node from these
#   cosign.pub                        release.yml diffs it against the signing key
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Is anything other than documentation changed?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull_request checks out the merge commit, so its first parent is
          # the base and the diff is exactly what merging would change. A push
          # to main compares with the commit main pointed at before.
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          else
            base=$BEFORE
          fi
          # Anything that cannot be diffed (a new branch, a force push past a
          # commit we do not have) counts as code, as does an empty diff.
          if ! files=$(git diff --name-only "$base" HEAD 2>/dev/null) || [ -z "$files" ]; then
            echo "cannot diff against '$base'; running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            case "$f" in
              *.md|LICENSE) ;;
              *) echo "code change: $f"; code=true ;;
            esac
          done <<< "$files"
          [ "$code" = true ] || echo "documentation only:" $files
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The exporter is meant to work with any Bitcoin Core node, so the
        # integration suite runs against more than the pinned release.
        #
        # 32.1-1   what the stack pins: Bitcoin Core 32.1 on distroless
        #          base-nossl-debian13. 32.x no longer reports `fullrbf`.
        # 31.3-2   the last 31.x release, same base.
        # 31.1-3   the previous pin, still in use by anyone who has not bumped.
        # 31.1     the ORIGINAL layout, which kept -datadir in cmd rather than
        #          the entrypoint. This leg is the one that keeps the harness
        #          honest about not depending on either split, and it is why the
        #          list is not simply "the newest".
        #
        # 31.1-2 is deliberately absent: its upstream release failed after the
        # push and carries no signatures, so nobody should be running it.
        node-image:
          - ghcr.io/thefutoneng/bitcoin:32.1-1
          - ghcr.io/thefutoneng/bitcoin:31.3-2
          - ghcr.io/thefutoneng/bitcoin:31.1-3
          - ghcr.io/thefutoneng/bitcoin:31.1
    name: integration (${{ matrix.node-image }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Pull the node image
        run: docker pull "${{ matrix.node-image }}"

      - name: Integration tests
        env:
          NODE_IMAGE: ${{ matrix.node-image }}
        run: go test -tags integration -count=1 -timeout 15m ./internal/integration/

  # The required check. See the comment at the top.
  integration-result:
    name: integration
    needs: [changes, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Change detection succeeded and the matrix passed, or was not needed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          MATRIX: ${{ needs.integration.result }}
        run: |
          # A failed `changes` job skips everything after it, and a skipped job
          # looks like a pass. So its failure has to fail this one.
          if [ "$CHANGES" != success ]; then
            echo "change detection: $CHANGES"; exit 1
          fi
          if [ "$CODE" != true ]; then
            echo "documentation-only change: the integration suite did not need to run"
            exit 0
          fi
          if [ "$MATRIX" != success ]; then
            echo "integration matrix: $MATRIX"; exit 1
          fi
          echo "every integration leg passed"

  stack:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Generate regtest activity
        run: ./scripts/regtest-activity.sh

      - name: Exporter serves metrics
        run: |
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:9332/metrics > metrics.txt
          grep -q '^bitcoin_up 1$' metrics.txt
          grep -q '^bitcoin_blocks ' metrics.txt
          # Every enabled collector must have succeeded against a healthy node.
          if grep -E '^bitcoin_exporter_collector_success\{.*\} 0$' metrics.txt; then
            echo "a collector failed"; exit 1
          fi

      - name: Prometheus scrapes the exporter
        run: |
          for _ in $(seq 1 30); do
            health=$(curl -fsS 'http://127.0.0.1:9090/api/v1/targets?state=active' \
              | python3 -c 'import sys,json;print(next((t["health"] for t in json.load(sys.stdin)["data"]["activeTargets"] if t["labels"]["job"]=="bitcoin"), "missing"))')
            [ "$health" = "up" ] && exit 0
            sleep 2
          done
          echo "prometheus never scraped the exporter successfully"; exit 1

      - name: Alert rules load and evaluate
        run: python3 scripts/check-alert-rules.py

      - name: Grafana provisions the dashboard
        run: |
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors \
            -u admin:admin http://127.0.0.1:3000/api/dashboards/uid/bitcoin-node \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["dashboard"]["title"], len(d["dashboard"]["panels"]), "panels")'

      - name: Every dashboard query is valid
        run: python3 scripts/check-dashboard-queries.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v

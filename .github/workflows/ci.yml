name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The exporter is meant to work with any Bitcoin Core node, so the
        # integration suite runs against more than the pinned release.
        #
        # 31.1-3   what the stack pins. Newest packaging.
        # 31.1-1   the previous packaging, still in use by anyone who has not
        #          bumped. Same runtime config as -3; only labels differ.
        # 31.1     the ORIGINAL layout, which kept -datadir in cmd rather than
        #          the entrypoint. This leg is the one that keeps the harness
        #          honest about not depending on either split, and it is why the
        #          list is not simply "the newest".
        #
        # 31.1-2 is deliberately absent: its upstream release failed after the
        # push and carries no signatures, so nobody should be running it.
        node-image:
          - ghcr.io/thefutoneng/bitcoin:31.1-3
          - ghcr.io/thefutoneng/bitcoin:31.1-1
          - ghcr.io/thefutoneng/bitcoin:31.1
    name: integration (${{ matrix.node-image }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Pull the node image
        run: docker pull "${{ matrix.node-image }}"

      - name: Integration tests
        env:
          NODE_IMAGE: ${{ matrix.node-image }}
        run: go test -tags integration -count=1 -timeout 15m ./internal/integration/

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Generate regtest activity
        run: ./scripts/regtest-activity.sh

      - name: Exporter serves metrics
        run: |
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:9332/metrics > metrics.txt
          grep -q '^bitcoin_up 1$' metrics.txt
          grep -q '^bitcoin_blocks ' metrics.txt
          # Every enabled collector must have succeeded against a healthy node.
          if grep -E '^bitcoin_exporter_collector_success\{.*\} 0$' metrics.txt; then
            echo "a collector failed"; exit 1
          fi

      - name: Prometheus scrapes the exporter
        run: |
          for _ in $(seq 1 30); do
            health=$(curl -fsS 'http://127.0.0.1:9090/api/v1/targets?state=active' \
              | python3 -c 'import sys,json;print(next((t["health"] for t in json.load(sys.stdin)["data"]["activeTargets"] if t["labels"]["job"]=="bitcoin"), "missing"))')
            [ "$health" = "up" ] && exit 0
            sleep 2
          done
          echo "prometheus never scraped the exporter successfully"; exit 1

      - name: Alert rules load and evaluate
        run: python3 scripts/check-alert-rules.py

      - name: Grafana provisions the dashboard
        run: |
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors \
            -u admin:admin http://127.0.0.1:3000/api/dashboards/uid/bitcoin-node \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["dashboard"]["title"], len(d["dashboard"]["panels"]), "panels")'

      - name: Every dashboard query is valid
        run: python3 scripts/check-dashboard-queries.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v
